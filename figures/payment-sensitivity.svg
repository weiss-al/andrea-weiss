<text x="78" y="564" font-size="12.5" fill="#52514e">Assumes 20% of aware locals take the tour, a $1 headset per user, no card fee to the museum, and a $5 net gift shop spend per added local only.</text>
<text x="78" y="582" font-size="12.5" fill="#52514e">Take-up and marketing response are placeholder assumptions. Payments above $7 mean locals pay more than today's price. Source: author's model.</text>
