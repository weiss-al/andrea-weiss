<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="Times New Roman, Times, serif">
<title id="t">Rise in local visitors needed to break even, by average pay-what-you-want payment</title>
<desc id="d">Line chart at a $5 gift shop spend per added local. The required rise in local visitors falls as the average payment rises, and reaches zero between about $6 and $7.50 depending on marketing spend.</desc>
